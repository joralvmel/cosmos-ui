name: Docs

# Pull requests: the docs site is built as a check and uploaded as a preview artifact.
# Pushes to main: the site is deployed to GitHub Pages when the repository variable
# COSMOS_DOCS_ENABLED is "true" (Settings → Pages → Source: GitHub Actions). See the Publishing guide.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - id: pages
        if: github.event_name != 'pull_request' && vars.COSMOS_DOCS_ENABLED == 'true'
        uses: actions/configure-pages@v6

      - name: Build docs
        run: npx turbo run build --filter=@joralvmel/cosmos-docs...
        env:
          COSMOS_DOCS_URL: ${{ steps.pages.outputs.base_url }}

      - name: Upload preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: docs-preview-pr-${{ github.event.pull_request.number }}
          path: apps/docs/dist
          retention-days: 7

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && vars.COSMOS_DOCS_ENABLED == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.COSMOS_DOCS_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
