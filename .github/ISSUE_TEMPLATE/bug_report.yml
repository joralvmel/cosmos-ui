name: Bug report
description: Something does not work as documented.
labels: ["type:bug", "status:triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Please check the [component status](https://joralvmel.github.io/cosmos-ui/components/status/) and existing issues first.
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - tokens
        - tailwind
        - core
        - elements
        - react
        - angular
        - native
        - charts-core
        - charts
        - charts-native
        - icons
        - i18n
        - mcp
        - cli
        - docs site
        - not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - HTML / Web Components
        - React / Vite
        - Next.js
        - Angular
        - React Native / Expo
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Code, a link to a repository or StackBlitz, and steps.
      render: tsx
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser or device, OS, framework version, theme and mode.
  - type: checkboxes
    id: accessibility
    attributes:
      label: Accessibility
      options:
        - label: This affects keyboard, screen reader or contrast behavior.
