name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  ASTRO_TELEMETRY_DISABLED: 1
  EXPO_NO_TELEMETRY: 1

jobs:
  verify:
    name: Lint, terms, typecheck, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint & format (Biome)
        run: npx biome ci .

      - name: Blocked terms
        run: node tools/check-terms.mjs
        env:
          COSMOS_BLOCKED_TERMS: ${{ secrets.COSMOS_BLOCKED_TERMS }}
          # Pull requests from forks do not receive secrets; the check is enforced on pushes.
          COSMOS_REQUIRE_TERMS: ${{ github.event_name == 'push' && '1' || '0' }}

      - name: Typecheck, test & build (affected packages on pull requests)
        run: npx turbo run typecheck test build ${{ github.event_name == 'pull_request' && '--affected' || '' }}
        env:
          TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}

      - name: Publishable packages (manifests and npm pack --dry-run)
        run: npm run check-packs

  changeset:
    name: Changeset present
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts

      # Fails when a publishable package changed without a changeset (`npm run changeset`).
      # Same-repository main -> develop syncs contain already-published, consumed changesets.
      # Dependabot pull requests are classified by the next step instead.
      - name: Check changesets
        if: >-
          !(github.head_ref == 'main' && github.base_ref == 'develop' &&
            github.event.pull_request.head.repo.full_name == github.repository) &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        run: npx changeset status --since=origin/${{ github.base_ref }}

      # Development and runtime patch/minor updates pass (runtime ones get a changeset before the
      # release with `npm run deps:changeset`); majors, peers and the pinned stack need one here.
      - name: Classify dependency updates (Dependabot)
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node tools/deps/dependency-changes.mjs pr --base "origin/$BASE_REF"

      - name: Released runtime dependency updates have changesets
        if: github.base_ref == 'main' && github.head_ref == 'develop'
        run: node tools/deps/dependency-changes.mjs release --base origin/main

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Blocks new dependencies with known high/critical vulnerabilities or a license outside the list.
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          allow-licenses: >-
            MIT, MIT-0, ISC, 0BSD, BSD-2-Clause, BSD-3-Clause, Apache-2.0, BlueOak-1.0.0,
            CC0-1.0, CC-BY-3.0, CC-BY-4.0, OFL-1.1, Python-2.0, Unlicense, MPL-2.0
